<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>
  <h1>User Registration Form</h1>
  <img src="https://static.vecteezy.com/system/resources/previews/010/925/404/non_2x/registration-page-name-and-password-field-fill-in-form-menu-bar-corporate-website-create-account-user-information-flat-design-modern-illustration-vector.jpg" alt="User Registration Form" width="380" height="300">
  <form action="#" method="post">
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br></br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br></br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
        <br></br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male" required>Male
        <input type="radio" name="gender" value="Female" required>Female
        <br></br>

        <label for="date">DOB:</label>
        <input type="date" id="date" name="date" placeholder="Enter your date of birth" required>
        <br></br

        <label for="file">File:</label>
        <input type="file" id="file" name="file" placeholder="Attach your file" required>
        <br></br>

        <label>Continue:</label>
        <input type="radio" name="continue" required>Yes
        <input type="radio" name="continue" required>No
        <br></br>

        <button type="submit">Submit</button>
    </div>
  </form>
</body>
</html>
